name: Verificar acessibilidade pública (diagnóstico)
on:
  pull_request:
    paths:
      - '.github/workflows/smoke-public-20261010.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Consultar domínios sem login e sem alterações
        run: |
          set +e
          for url in "https://app.presencaconfirmada.com.br/" "https://app.presencaconfirmada.com.br/app/login" "https://app.presencaconfirmada.com.br/vendor/app.js" "https://app.presencaconfirmada.com.br/libri-diagnostics.js?v=1" "https://app.presencaconfirmada.com.br/api/plans" "https://pedidos.libriconvites.com.br/admin-v2" "https://confirmacao.libriconvites.com.br/admin" "https://momentos.libriconvites.com.br/admin" "https://presentes.libriconvites.com.br/admin"; do
            echo "==> ${url}"
            curl --silent --show-error --location --max-time 12 --output /tmp/httpcheck --write-out "code=%{http_code} bytes=%{size_download} content_type=%{content_type} url=%{url_effective}\n" "${url}"
            head -c 105 /tmp/httpcheck | tr '\n' ' '
            echo
          done

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Instalar Chrome automation
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D playwright@1.55.0
      - name: Abrir site de verdade em navegador Chrome mobile
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,channel:'chrome'});
          let broken=false;
          try{
            for (const path of ['/','/app/login','/admin']) {
              const ctx=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const p=await ctx.newPage();
              const errs=[];
              p.on('pageerror',err=>errs.push(err.message.slice(0,220)));
              const r=await p.goto('https://app.presencaconfirmada.com.br'+path,{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForTimeout(2800);
              const result=await p.evaluate(()=>({url:location.pathname,text:document.querySelector('#app')?.innerText.slice(0,280),title:document.title}));
              console.log(JSON.stringify({path,status:r.status(),...result,errs}));
              if(!r.ok()||errs.length||result.text?.includes('Carregando…')) broken=true;
              await ctx.close();
            }
          }finally{await b.close()}
          if(broken)process.exit(1);
          NODE
