name: Validar correção health panel

on:
  push:
    branches:
      - fix-health-panel-signals
    paths:
      - '.github/workflows/validate-health-panel-once.yml'

permissions:
  contents: read

concurrency:
  group: validate-health-panel
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm exec wrangler d1 migrations apply DB --local
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm exec wrangler deploy --dry-run --outdir dist/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm exec wrangler deploy --dry-run --env hml --outdir dist/cloudflare-hml
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm add -D playwright@1.55.0
      - name: Browser smoke Chrome
        run: BROWSER_CHANNEL=chrome node tests/browser-smoke.mjs
