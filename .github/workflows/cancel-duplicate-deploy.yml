name: Cancelar deploy duplicado
on:
  push:
    branches: [main]
    paths: [docs/CANCEL_DUPLICATE_DEPLOY]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar segunda execução comercial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cancel.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jbritoartesdigital-pixel/rsvp-plataforma/actions/runs/37413973384/cancel")"
          echo "cancel_http=$code"
          test "$code" = "202" || test "$code" = "409"
