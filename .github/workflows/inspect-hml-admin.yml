name: Inspecionar admins HML

on:
  push:
    branches: [main]
    paths: [docs/INSPECT_ADMIN_NOW]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consultar papéis de usuários na HML
        run: |
          pnpm exec wrangler d1 execute DB --remote --env hml --command="SELECT s.id,s.name,(SELECT COUNT(*) FROM users u WHERE u.studio_id=s.id) AS users,(SELECT COUNT(*) FROM events e WHERE e.studio_id=s.id) AS events,(SELECT COUNT(*) FROM billing_orders o WHERE o.studio_id=s.id) AS orders,(SELECT COUNT(*) FROM credit_ledger l WHERE l.studio_id=s.id) AS ledger FROM studios s ORDER BY s.created_at ASC;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
