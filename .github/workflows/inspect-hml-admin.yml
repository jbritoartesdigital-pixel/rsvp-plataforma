name: Inspecionar admins HML

on:
  push:
    branches: [main]
    paths: [docs/INSPECT_ADMIN_NOW]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consultar papéis de usuários na HML
        run: |
          pnpm exec wrangler d1 execute DB --remote --env hml --command="SELECT u.name,u.role,s.name AS studio_name FROM users u LEFT JOIN studios s ON s.id=u.studio_id ORDER BY u.created_at ASC;"
          pnpm exec wrangler d1 execute DB --remote --env hml --command="SELECT role,COUNT(*) AS total FROM users GROUP BY role ORDER BY role;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
