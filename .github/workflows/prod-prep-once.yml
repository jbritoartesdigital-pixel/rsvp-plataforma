name: Preparar produção sem publicar

on:
  push:
    branches: [main]
    paths: [docs/PROD_PREP_NOW]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: node scripts/guard-deploy.mjs

      - name: Garantir DNS wildcard comercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone="682ae38c7ae33e59b117fef7355b5c1f"
          name="*.presencaconfirmada.com.br"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=%2A.presencaconfirmada.com.br" > /tmp/dns.json
          count="$(jq '.result | length' /tmp/dns.json)"
          if [ "$count" = "0" ]; then
            curl -sS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records"               --data '{"type":"A","name":"*.presencaconfirmada.com.br","content":"192.0.2.0","ttl":1,"proxied":true}' > /tmp/create.json
            jq -e '.success == true' /tmp/create.json >/dev/null
            echo "wildcard_dns=created"
          else
            proxied="$(jq -r '.result[0].proxied' /tmp/dns.json)"
            echo "wildcard_dns=exists"
            echo "wildcard_type=$(jq -r '.result[0].type' /tmp/dns.json)"
            echo "wildcard_proxied=$proxied"
            test "$proxied" = "true"
          fi

      - name: Criar Worker sem rota pública
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          jq 'del(.routes) | .workers_dev=false | .preview_urls=false' wrangler.jsonc > wrangler.prod-shell.json
          pnpm exec wrangler deploy --config wrangler.prod-shell.json --env=""

      - name: Conferir secrets existentes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler secret list || true
