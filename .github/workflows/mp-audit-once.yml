name: Auditar secrets Mercado Pago Workers

on:
  push:
    branches: [main]
    paths: [docs/MP_AUDIT_NOW]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Listar nomes dos secrets de produção e HML
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== PROD ==="
          pnpm exec wrangler secret list || true
          echo "=== HML ==="
          pnpm exec wrangler secret list --env hml || true
