name: Configurar subdomínios das conviteiras

on:
  push:
    branches: [main]
    paths: [docs/SETUP_TENANT_DNS_NOW]

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - name: Garantir wildcard DNS proxied
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ZONE_ID="$(curl -fsS -H "$AUTH" -H "Content-Type: application/json" --get "$API/zones" --data-urlencode "name=presencaconfirmada.com.br" --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" | jq -r '.result[0].id // empty')"
          test -n "$ZONE_ID"
          EXISTING="$(curl -fsS -H "$AUTH" -H "Content-Type: application/json" --get "$API/zones/$ZONE_ID/dns_records" --data-urlencode "name=*.presencaconfirmada.com.br")"
          COUNT="$(printf '%s' "$EXISTING" | jq -r '.result | length')"
          if [ "$COUNT" = "0" ]; then
            curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/zones/$ZONE_ID/dns_records" \
              --data '{"type":"AAAA","name":"*.presencaconfirmada.com.br","content":"100::","ttl":1,"proxied":true}' \
              | jq -e '.success == true' >/dev/null
            echo "Wildcard DNS criado."
          else
            PROXIED="$(printf '%s' "$EXISTING" | jq -r '.result[0].proxied')"
            test "$PROXIED" = "true"
            echo "Wildcard DNS já existe e está proxied."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
