name: Publicar plataforma comercial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rsvp-plataforma-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - name: Conferir destino comercial
        run: node scripts/guard-deploy.mjs
      - name: Conferir secrets obrigatórios do Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --env="" > /tmp/prod-secrets.json
          jq -e 'map(.name) | index("MP_ACCESS_TOKEN") != null' /tmp/prod-secrets.json >/dev/null
          jq -e 'map(.name) | index("MP_WEBHOOK_SECRET") != null' /tmp/prod-secrets.json >/dev/null
          echo "Secrets Mercado Pago presentes no Worker comercial."

      - name: Aplicar migrations no D1 comercial
        run: pnpm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar Worker e arquivos
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke público comercial
        run: |
          set -euo pipefail
          curl -fSsL --retry 8 --retry-delay 2 https://app.presencaconfirmada.com.br/ >/tmp/prod-home.html
          grep -q "Presença Confirmada" /tmp/prod-home.html
          curl -fSsL --retry 8 --retry-delay 2 https://app.presencaconfirmada.com.br/api/plans >/tmp/prod-plans.json
          jq -e '.plans | length > 0' /tmp/prod-plans.json >/dev/null
          random="slug-smoke-$(date -u +%Y%m%d%H%M%S).presencaconfirmada.com.br"
          test -n "$(getent ahosts "$random" | head -1)"
          echo "Produção pública respondeu e wildcard DNS resolve."
