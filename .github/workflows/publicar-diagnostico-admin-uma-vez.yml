name: Validar e publicar diagnóstico Admin uma vez
on:
  pull_request:
    paths:
      - 'public/app.js'
      - 'public/admin-diagnostics.js'
      - 'public/styles.css'
      - 'tests/admin-diagnostics.test.mjs'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/publicar-diagnostico-admin-uma-vez.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-diagnostico-admin-uma-vez.yml'
permissions:
  contents: read
concurrency:
  group: diagnostico-admin-safe-release
  cancel-in-progress: false
jobs:
  verificar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Testar e compilar frontend e Worker
        run: pnpm run validate
      - name: Browser smoke com Super Admin real e viewport mobile
        run: |
          pnpm add -D playwright@1.55.0
          BROWSER_CHANNEL=chrome node tests/browser-smoke.mjs
      - name: Conferir destino Cloudflare
        run: node scripts/guard-deploy.mjs
      - name: Dry-run de deploy
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/admin-diag-check
      - name: Publicar somente arquivos e Worker sem migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
      - name: Smoke público sem autenticação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL --retry 5 --retry-delay 2 https://app.presencaconfirmada.com.br/app/login >/tmp/login.html
          grep -q '/vendor/app.js' /tmp/login.html
          curl -fsSL --retry 5 --retry-delay 2 https://app.presencaconfirmada.com.br/api/plans >/tmp/plans.json
          node -e "const p=require('/tmp/plans.json');if(!Array.isArray(p.plans)||!p.plans.length)process.exit(1)"
