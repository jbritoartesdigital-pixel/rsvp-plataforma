name: Auditar banco comercial vazio
on:
  push:
    branches: [main]
    paths: [docs/PROD_DB_AUDIT_NOW]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contar contas comerciais sem expor dados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute DB --remote --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM studios) AS studios, (SELECT COUNT(*) FROM events) AS events;" --json > /tmp/audit.json
          jq '.[0].results[0]' /tmp/audit.json
