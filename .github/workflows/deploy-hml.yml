name: Publicar homologação comercial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/DEPLOY_HML_NOW]

permissions:
  contents: read

concurrency:
  group: rsvp-plataforma-hml-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - name: Conferir destino de homologação
        run: node scripts/guard-deploy-hml.mjs
      - name: Aplicar migrations no D1 de homologação
        run: pnpm exec wrangler d1 migrations apply DB --remote --env hml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Limpar tentativas antigas de checkout da HML
        run: |
          pnpm exec wrangler d1 execute DB --remote --env hml --command="UPDATE billing_orders SET status='failed' WHERE status='pending' AND checkout_url IS NOT NULL;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Desvincular Super Admin de conta conviteira na HML
        run: |
          pnpm exec wrangler d1 execute DB --remote --env hml --command="UPDATE sessions SET impersonated_studio_id=NULL WHERE user_id IN (SELECT id FROM users WHERE role='super_admin');"
          pnpm exec wrangler d1 execute DB --remote --env hml --command="UPDATE users SET studio_id=NULL WHERE role='super_admin';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar Worker de homologação
        run: pnpm exec wrangler deploy --env hml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
