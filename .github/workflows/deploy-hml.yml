name: Publicar homologação comercial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsvp-plataforma-hml-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - name: Conferir destino de homologação
        run: node scripts/guard-deploy-hml.mjs
      - name: Aplicar migrations no D1 de homologação
        run: pnpm exec wrangler d1 migrations apply DB --remote --env hml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Garantir primeiro Super Admin da HML
        run: |
          pnpm exec wrangler d1 execute DB --remote --env hml --command="UPDATE users SET role='super_admin' WHERE id=(SELECT id FROM users WHERE role='studio_owner' ORDER BY created_at ASC LIMIT 1) AND NOT EXISTS(SELECT 1 FROM users WHERE role='super_admin');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar Worker de homologação
        run: pnpm exec wrangler deploy --env hml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
