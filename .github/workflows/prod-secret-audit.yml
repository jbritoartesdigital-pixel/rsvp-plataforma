name: Auditar secrets de produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirmar secrets obrigatórios sem revelar valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list > /tmp/secrets.json
          jq -e 'map(.name) | index("MP_ACCESS_TOKEN") != null' /tmp/secrets.json >/dev/null
          jq -e 'map(.name) | index("MP_WEBHOOK_SECRET") != null' /tmp/secrets.json >/dev/null
          echo "mp_access_token_present=true"
          echo "mp_webhook_secret_present=true"
