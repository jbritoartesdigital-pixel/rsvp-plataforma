name: Promover primeiro Super Admin comercial
on:
  push:
    branches: [main]
    paths: [docs/PROMOTE_FIRST_ADMIN_NOW]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Promover única conta comercial e separar do tenant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute DB --remote --command "SELECT (SELECT COUNT(*) FROM users) users,(SELECT COUNT(*) FROM users WHERE role='studio_owner') owners,(SELECT COUNT(*) FROM events) events,(SELECT COUNT(*) FROM billing_orders) orders;" --json > /tmp/before.json
          users="$(jq -r '.[0].results[0].users' /tmp/before.json)"
          owners="$(jq -r '.[0].results[0].owners' /tmp/before.json)"
          events="$(jq -r '.[0].results[0].events' /tmp/before.json)"
          orders="$(jq -r '.[0].results[0].orders' /tmp/before.json)"
          test "$users" = "1"
          test "$owners" = "1"
          test "$events" = "0"
          test "$orders" = "0"

          pnpm exec wrangler d1 execute DB --remote --command "UPDATE sessions SET impersonated_studio_id=NULL WHERE user_id=(SELECT id FROM users LIMIT 1); UPDATE users SET role='super_admin',studio_id=NULL WHERE id=(SELECT id FROM users LIMIT 1);" >/tmp/promote.txt

          pnpm exec wrangler d1 execute DB --remote --command "DELETE FROM studios WHERE NOT EXISTS(SELECT 1 FROM users WHERE users.studio_id=studios.id) AND NOT EXISTS(SELECT 1 FROM events WHERE events.studio_id=studios.id) AND NOT EXISTS(SELECT 1 FROM billing_orders WHERE billing_orders.studio_id=studios.id) AND NOT EXISTS(SELECT 1 FROM credit_ledger WHERE credit_ledger.studio_id=studios.id) AND NOT EXISTS(SELECT 1 FROM audit_logs WHERE audit_logs.studio_id=studios.id);" >/tmp/cleanup.txt

          pnpm exec wrangler d1 execute DB --remote --command "SELECT (SELECT COUNT(*) FROM users WHERE role='super_admin') super_admins,(SELECT COUNT(*) FROM users WHERE role='studio_owner') owners,(SELECT COUNT(*) FROM users WHERE role='super_admin' AND studio_id IS NOT NULL) linked_admins,(SELECT COUNT(*) FROM studios) studios;" --json > /tmp/after.json
          jq '.[0].results[0]' /tmp/after.json
          test "$(jq -r '.[0].results[0].super_admins' /tmp/after.json)" = "1"
          test "$(jq -r '.[0].results[0].owners' /tmp/after.json)" = "0"
          test "$(jq -r '.[0].results[0].linked_admins' /tmp/after.json)" = "0"
