name: Auditar DNS HML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar resolução pública do namespace HML
        run: |
          set -euo pipefail
          random_host="slug-audit-$(date -u +%Y%m%d%H%M%S).hml.presencaconfirmada.com.br"
          hml_a="$(dig +short hml.presencaconfirmada.com.br A | paste -sd, -)"
          hml_aaaa="$(dig +short hml.presencaconfirmada.com.br AAAA | paste -sd, -)"
          tenant_a="$(dig +short "$random_host" A | paste -sd, -)"
          tenant_aaaa="$(dig +short "$random_host" AAAA | paste -sd, -)"
          hml_code="$(curl -L -sS -o /tmp/hml.html -w '%{http_code}' --max-time 15 https://hml.presencaconfirmada.com.br/ || true)"
          tenant_code="$(curl -L -sS -o /tmp/tenant.html -w '%{http_code}' --max-time 15 "https://$random_host/" || true)"
          printf 'HML root: A=%s AAAA=%s HTTP=%s\n' "$hml_a" "$hml_aaaa" "$hml_code"
          printf 'HML tenant: host=%s A=%s AAAA=%s HTTP=%s\n' "$random_host" "$tenant_a" "$tenant_aaaa" "$tenant_code"
          test -n "$hml_a$hml_aaaa"
