name: Auditar permissões Cloudflare uma vez

on:
  push:
    branches: [main]
    paths: [docs/CLOUDFLARE_PERMISSIONS_AUDIT_NOW]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4

      - name: Consultar Workers Domains e permissões da zona
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          domains_tmp="$(mktemp)"
          domains_code="$(curl -sS -o "$domains_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          zone_id=""
          if [ "$domains_code" = "200" ]; then
            zone_id="$(jq -r '.result[]? | select(.hostname=="hml.presencaconfirmada.com.br") | .zone_id' "$domains_tmp" | head -1)"
          fi

          dns_code="not_checked"
          routes_code="not_checked"
          dns='[]'
          routes='[]'
          if [ -n "$zone_id" ]; then
            dns_tmp="$(mktemp)"
            routes_tmp="$(mktemp)"
            dns_code="$(curl -sS -o "$dns_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100")"
            routes_code="$(curl -sS -o "$routes_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")"
            if [ "$dns_code" = "200" ]; then
              dns="$(jq '[.result[] | select(.name=="*.presencaconfirmada.com.br" or .name=="hml.presencaconfirmada.com.br" or .name=="app.presencaconfirmada.com.br") | {id,type,name,content,proxied}]' "$dns_tmp")"
            fi
            if [ "$routes_code" = "200" ]; then
              routes="$(jq '[.result[] | {id,pattern,script}]' "$routes_tmp")"
            fi
          fi

          jq -n             --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg domains_code "$domains_code"             --arg zone_id "$zone_id"             --arg dns_code "$dns_code"             --arg routes_code "$routes_code"             --argjson dns "$dns"             --argjson routes "$routes"             '{checked_at:$checked_at,workers_domains_http:$domains_code,zone_id:$zone_id,dns_http:$dns_code,routes_http:$routes_code,dns:$dns,routes:$routes}'             > docs/cloudflare-permissions-audit-result.json

      - name: Registrar resultado sanitizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cloudflare-permissions-audit-result.json
          git commit -m "ci: record Cloudflare permission audit result" || exit 0
          git push
