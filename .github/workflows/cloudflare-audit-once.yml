name: Auditar Cloudflare uma vez

on:
  push:
    branches: [main]
    paths: [docs/CLOUDFLARE_AUDIT_NOW]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4

      - name: Consultar DNS e Worker routes sem alterar nada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=presencaconfirmada.com.br&status=active")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"

          dns_json="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100")"
          routes_json="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")"

          jq -n             --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg zone_id "$zone_id"             --argjson dns "$(printf '%s' "$dns_json" | jq '[.result[] | select(.name=="*.presencaconfirmada.com.br" or .name=="hml.presencaconfirmada.com.br" or .name=="app.presencaconfirmada.com.br") | {id,type,name,content,proxied,ttl}]')"             --argjson routes "$(printf '%s' "$routes_json" | jq '[.result[] | {id,pattern,script}]')"             '{checked_at:$checked_at,zone_id:$zone_id,dns:$dns,routes:$routes}'             > docs/cloudflare-audit-result.json

      - name: Registrar resultado sanitizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cloudflare-audit-result.json
          git commit -m "ci: record Cloudflare audit result" || exit 0
          git push
