name: Verificar token Cloudflare HML

on:
  push:
    branches: [main]
    paths: [docs/CLOUDFLARE_PERMISSIONS_AUDIT_NOW]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: commercial
    steps:
      - uses: actions/checkout@v4

      - name: Verificar permissões e preparar wildcard DNS HML
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          zones_tmp="$(mktemp)"
          zone_code="$(curl -sS -o "$zones_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=presencaconfirmada.com.br")"
          echo "zone_read_http=$zone_code"
          test "$zone_code" = "200"

          zone_id="$(jq -r '.result[0].id // empty' "$zones_tmp")"
          test -n "$zone_id"
          echo "zone_id=$zone_id"

          dns_tmp="$(mktemp)"
          dns_code="$(curl -sS -o "$dns_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=%2A.hml.presencaconfirmada.com.br")"
          echo "dns_read_http=$dns_code"
          test "$dns_code" = "200"

          routes_tmp="$(mktemp)"
          routes_code="$(curl -sS -o "$routes_tmp" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")"
          echo "routes_read_http=$routes_code"
          test "$routes_code" = "200"

          existing_count="$(jq '.result | length' "$dns_tmp")"
          if [ "$existing_count" -eq 0 ]; then
            create_tmp="$(mktemp)"
            create_code="$(curl -sS -o "$create_tmp" -w '%{http_code}' -X POST "${auth[@]}"               "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"               --data '{"type":"AAAA","name":"*.hml.presencaconfirmada.com.br","content":"100::","ttl":1,"proxied":true}')"
            echo "dns_create_http=$create_code"
            test "$create_code" = "200"
            jq -e '.success == true' "$create_tmp" >/dev/null
            echo "wildcard_dns=created"
          else
            echo "wildcard_dns=already_exists"
            jq -r '.result[] | "dns_type=" + .type + " dns_name=" + .name + " proxied=" + (.proxied|tostring)' "$dns_tmp"
          fi

          route_match="$(jq -r '[.result[] | select(.pattern=="*.hml.presencaconfirmada.com.br/*")] | length' "$routes_tmp")"
          echo "hml_wildcard_route_count=$route_match"

      - name: Confirmar resolução pública do wildcard
        run: |
          set -euo pipefail
          host="slug-audit-$(date -u +%Y%m%d%H%M%S).hml.presencaconfirmada.com.br"
          resolved=""
          for i in 1 2 3 4 5 6; do
            resolved="$(dig +short "$host" A; dig +short "$host" AAAA)"
            if [ -n "$resolved" ]; then break; fi
            sleep 5
          done
          echo "wildcard_test_host=$host"
          printf 'resolved=%s\n' "$resolved"
          test -n "$resolved"
