name: Auditar DNS público uma vez

on:
  push:
    branches: [main]
    paths: [docs/DNS_AUDIT_NOW]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar resolução pública sem alterar DNS
        run: |
          set -euo pipefail
          random_host="slug-audit-20261005.presencaconfirmada.com.br"
          hml_a="$(dig +short hml.presencaconfirmada.com.br A | paste -sd, -)"
          hml_aaaa="$(dig +short hml.presencaconfirmada.com.br AAAA | paste -sd, -)"
          wildcard_a="$(dig +short "$random_host" A | paste -sd, -)"
          wildcard_aaaa="$(dig +short "$random_host" AAAA | paste -sd, -)"
          hml_code="$(curl -L -sS -o /tmp/hml.html -w '%{http_code}' --max-time 15 https://hml.presencaconfirmada.com.br/ || true)"
          wildcard_code="$(curl -L -sS -o /tmp/wildcard.html -w '%{http_code}' --max-time 15 "https://$random_host/" || true)"
          hml_title="$(grep -oi '<title>[^<]*' /tmp/hml.html 2>/dev/null | head -1 | sed 's/<title>//I' || true)"
          wildcard_title="$(grep -oi '<title>[^<]*' /tmp/wildcard.html 2>/dev/null | head -1 | sed 's/<title>//I' || true)"

          jq -n             --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg random_host "$random_host"             --arg hml_a "$hml_a" --arg hml_aaaa "$hml_aaaa"             --arg wildcard_a "$wildcard_a" --arg wildcard_aaaa "$wildcard_aaaa"             --arg hml_code "$hml_code" --arg wildcard_code "$wildcard_code"             --arg hml_title "$hml_title" --arg wildcard_title "$wildcard_title"             '{checked_at:$checked_at,random_host:$random_host,hml:{a:$hml_a,aaaa:$hml_aaaa,http_code:$hml_code,title:$hml_title},wildcard:{a:$wildcard_a,aaaa:$wildcard_aaaa,http_code:$wildcard_code,title:$wildcard_title}}'             > docs/cloudflare-audit-result.json

      - name: Registrar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cloudflare-audit-result.json
          git commit -m "ci: record public DNS audit result" || exit 0
          git push
