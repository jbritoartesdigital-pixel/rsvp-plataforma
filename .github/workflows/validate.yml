name: Validar plataforma sem publicar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/VALIDATE_NOW]

permissions:
  contents: read

concurrency:
  group: validate-commercial
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Sintaxe, testes e build
        run: pnpm run validate

      - name: Validar migrations D1 localmente
        run: pnpm exec wrangler d1 migrations apply DB --local
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Dry-run do Worker
        run: pnpm exec wrangler deploy --dry-run --outdir dist/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Dry-run do Worker HML
        run: pnpm exec wrangler deploy --dry-run --env hml --outdir dist/cloudflare-hml
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Instalar Playwright para smoke local
        run: pnpm add -D playwright@1.55.0

      - name: Browser smoke em Chrome
        run: BROWSER_CHANNEL=chrome node tests/browser-smoke.mjs
