name: Publicar diagnóstico uma vez - rsvp-plataforma
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-diagnostico-uma-vez.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-diagnostico-uma-vez.yml'
permissions:
  contents: read
concurrency:
  group: deploy-diagnostico-rsvp-plataforma
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar plataforma
        run: pnpm run validate
      - name: Conferir destino
        run: node scripts/guard-deploy.mjs
      - name: Validar Worker sem publicar
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/diag-dry
      - name: Publicar somente Worker sem migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
